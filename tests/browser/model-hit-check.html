<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ouento 픽셀과 클릭 영역 비교</title>
    <style>
      body {
        margin: 24px;
        font: 15px/1.5 system-ui;
        background: #f7f6f2;
        color: #242035;
      }
      #stage {
        width: 300px;
        height: 400px;
        background: #e7e5df;
      }
      #gallery {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      figure {
        margin: 0;
      }
      figure canvas {
        width: 240px;
        height: 320px;
        background: #e7e5df;
      }
      button {
        font: inherit;
        padding: 10px 16px;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: white;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <h1>픽셀과 클릭 영역 비교</h1>
    <p>
      개발용 비교입니다. 같은 실제 렌더링 프레임에서 WebGL 알파와 제품 CPU 클릭 판정을 비교합니다.
      붉은 점은 투명한데 클릭되는 지점, 푸른 점은 불투명한데 클릭되지 않는 지점입니다.
    </p>
    <p>
      GPU 읽기는 이 검사에서 프레임별 한 번만 사용합니다. 네이티브 입력 통과·DPI·포커스 검증을
      대신하지 않습니다.
    </p>
    <button id="run">클릭 영역 비교</button>
    <p id="status" role="status">준비됨</p>
    <div id="stage"></div>
    <div id="gallery"></div>
    <pre id="report">Haru·Mao·Ren · 8개 상태 비교</pre>
    <script src="/vendor/cubism-core/live2dcubismcore.min.js"></script>
    <script src="/vendor/motionsync-core/CRI/live2dcubismmotionsynccore.min.js"></script>
    <script type="module" src="./model-hit-check.js"></script>
  </body>
</html>
