<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ouento 주기 갱신 UI 회귀 검사</title>
    <style>
      body {
        margin: 0;
        background: #f6f5f1;
        font: 14px/1.6 system-ui;
      }
      header,
      #results {
        padding: 16px 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      p {
        margin: 8px 0;
      }
      #status {
        font-weight: 600;
      }
      [data-passed='true'] {
        color: #276540;
      }
      [data-passed='false'] {
        color: #a02626;
      }
      #fixture {
        height: 680px;
        border-block: 1px solid #d9d9d1;
      }
      #report {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>개발 전용 · 주기 갱신 중 입력과 스크롤 유지</h1>
      <p>
        실제 Ouento Web Component에 합성 상태만 전달합니다. AI 호출·파일 저장·실제 화면 권한 요청은
        하지 않습니다. 운영체제의 바운스 애니메이션과 네이티브 select 팝업 자체는 앱에서 별도로
        확인해야 합니다.
      </p>
      <button id="run" type="button">회귀 검사 다시 실행</button>
      <p id="status" role="status">검사 준비 중…</p>
    </header>
    <div id="fixture"><ouento-app></ouento-app></div>
    <section id="results" aria-label="회귀 검사 결과">
      <ol id="checks"></ol>
      <details>
        <summary>상세 보고서</summary>
        <pre id="report"></pre>
      </details>
    </section>
    <script type="module" src="./ui-stability.js"></script>
  </body>
</html>
